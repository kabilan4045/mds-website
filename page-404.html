<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bixom Digital Marketing HTML Template</title>
<!-- Stylesheets -->
<link href="css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">

<link rel="shortcut icon" href="images/favicon.png" type="image/x-icon">
<link rel="icon" href="images/favicon.png" type="image/x-icon">

<!-- Responsive -->
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
</head>

<body>
<div class="page-wrapper">
	<!-- Preloader -->
  <div class="preloader"><div class="loader"></div></div>

	<!-- 404 Section -->
	<section class="">
		<div class="container pt-120 pb-70">
			<div class="row">
				<div class="col-xl-12">
					<div class="error-page__inner">
						<div class="error-page__title-box">
							<img src="images/resource/404.jpg" alt="">
							<h3 class="error-page__sub-title">Page not found!</h3>
						</div>
						<p class="error-page__text">Sorry we can't find that page! The page you are looking <br> for was never existed.</p>
						<form class="error-page__form">
							<div class="error-page__form-input">
								<input type="search" placeholder="Search here">
								<button type="submit"><i class="fa-classic fa-light fa-magnifying-glass fa-fw"></i></button>
							</div>
						</form>
						<a href="index.html" class="ks-btn-black yellow-bg"><span class="btn-title">Back to Home</span></a>
					</div>
				</div>
			</div>
		</div>
	</section>
	<!--End 404 Section -->

</div><!-- End Page Wrapper -->
<!-- Scroll To Top -->
<button class="scroll-top scroll-to-target" data-target="html"><i class="far fa-angle-double-up"></i></button>
<script src="js/jquery.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/gsap-plugins.js"></script>
<script src="js/purecounter.js"></script>
<script src="js/nice-select.js"></script>
<script src="js/imagesloaded-pkgd.js"></script>
<script src="js/magnific-popup.js"></script>
<script src="js/bxslider.js"></script>
<script src="js/swiper.min.js"></script>
<script src="js/slider-int.js"></script>
<script src="js/mixitup.js"></script>
<script src="js/script.js"></script>
</body>
</html>
